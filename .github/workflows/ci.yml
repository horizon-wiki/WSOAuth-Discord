name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The PHP versions MediaWiki 1.43 supports; revisit at the 1.47 upgrade.
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Lint every PHP file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
